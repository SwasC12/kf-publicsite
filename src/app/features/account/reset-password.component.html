
    <div class="auth-card reveal">
      <h1 class="auth-title">Choose a new password</h1>
      @if (!token) {
        <p class="alert error">This reset link is invalid or has expired.</p>
        <a class="btn primary big" routerLink="/account">Back to sign in</a>
      } @else if (done()) {
        <p class="alert success">Your password has been updated. You can now sign in.</p>
        <a class="btn primary big" routerLink="/account">Sign in</a>
      } @else {
        <p class="auth-sub">Choose a password of at least 8 characters.</p>
        <form (ngSubmit)="submit()">
          <label class="field"><span class="label-text">New password</span>
            <input type="password" name="pw" [(ngModel)]="password" required minlength="8" autocomplete="new-password" />
          </label>
          <label class="field"><span class="label-text">Confirm password</span>
            <input type="password" name="pw2" [(ngModel)]="confirm" required minlength="8" autocomplete="new-password" />
          </label>
          @if (error()) { <p class="alert error" role="alert">{{ error() }}</p> }
          <button type="submit" class="btn primary big" [disabled]="busy()">
            {{ busy() ? 'Updating…' : 'Update password' }}
          </button>
        </form>
      }
    </div>
